<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم عطر الشرق - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f0f2f5; padding: 20px; text-align: center; }
        .container { max-width: 600px; margin: auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #1a1a1a; margin-bottom: 20px; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #27ae60; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background-color: #219150; }
        .status { margin-top: 15px; font-weight: bold; color: #27ae60; }
    </style>
</head>
<body>

<div class="container">
    <h1>لوحة تحكم عطر الشرق</h1>
    <p>أضف عطر جديد للموقع مباشرة</p>
    
    <input type="text" id="perfumeName" placeholder="اسم العطر (مثلاً: سوفاج)">
    
    <select id="perfumeCategory">
        <option value="oriental">عطور شرقية فاخرة</option>
        <option value="men">عطور رجالى</option>
        <option value="women">عطور حريمي راقية</option>
        <option value="musk">عالم المسك والزهور</option>
    </select>

    <button onclick="addPerfume()">إضافة العطر الآن</button>
    <div id="status" class="status"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // الكود الخاص بمشروعك اللي بعتهولي
    const firebaseConfig = {
        apiKey: "AIzaSyBCMn91vlaQv-_PJYepWdDuWE9KzLkfRyg",
        authDomain: "etr-elsharq.firebaseapp.com",
        projectId: "etr-elsharq",
        storageBucket: "etr-elsharq.firebasestorage.app",
        messagingSenderId: "1082678595172",
        appId: "1:1082678595172:web:006ecab9d1d6d5d962d971"
    };

    // تشغيل فايربيز
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    // وظيفة الإضافة
    window.addPerfume = function() {
        const name = document.getElementById('perfumeName').value;
        const category = document.getElementById('perfumeCategory').value;
        const statusDiv = document.getElementById('status');

        if (name.trim() === "") {
            alert("يرجى كتابة اسم العطر");
            return;
        }

        // تحديد المكان في قاعدة البيانات بناءً على النوع
        const perfumeRef = ref(db, 'perfumes/' + category);
        const newPerfumeRef = push(perfumeRef);

        set(newPerfumeRef, name)
            .then(() => {
                statusDiv.innerText = "✅ تم إضافة (" + name + ") بنجاح!";
                document.getElementById('perfumeName').value = ""; // مسح الخانة بعد الإضافة
            })
            .catch((error) => {
                statusDiv.style.color = "red";
                statusDiv.innerText = "❌ حدث خطأ: " + error.message;
            });
    };
</script>

</body>
</html>
